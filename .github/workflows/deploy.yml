name: Deploy Portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run Oxlint
        run: bun run lint

      - name: Validate HTML
        run: bun run html:check

      - name: Check broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --accept 200,429
            "./**/*.html"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static files
        run: bun run build

      - name: Generate build info
        run: |
          mkdir -p dist/assets
          echo '{
            "lastDeployment": "'$(date -u +"%Y-%m-%d %H:%M UTC")'",
            "commit": "'${{ github.sha }}'",
            "status": "passing"
          }' > dist/assets/build-info.json

      - name: Prepare deploy folder
        run: |
          mkdir -p dist
          cp index.html dist/ 2>/dev/null || true
          [ -d "assets" ] && cp -r assets dist/
          [ -d "public" ] && cp -r public/* dist/
          ls -R dist/assets || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload Dist for Docker
        uses: actions/upload-artifact@v4
        with:
          name: compiled-dist
          path: ./dist

  push-to-docker-hub:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Dist artifact
        uses: actions/download-artifact@v4
        with:
          name: compiled-dist
          path: ./dist

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ github.sha }}
